name: Project control

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-project-control:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository control
        run: python scripts/validate_project_control.py --repository armpitpete/project-folder-checker

      - name: Test all audit classifications
        run: python scripts/test_audit_project_controls.py

      - name: Test evidence-bound Project Status v2 consumer
        working-directory: scripts
        run: python -m unittest -v test_project_status_v2.py

      - name: Prove deterministic privacy-safe status generation
        run: |
          python scripts/project_status_v2.py --repository owner/example --project-name Example --output /tmp/status-one.json
          python scripts/project_status_v2.py --repository owner/example --project-name Example --output /tmp/status-two.json
          cmp /tmp/status-one.json /tmp/status-two.json
          python scripts/project_status_v2.py --repository owner/example --project-name Example --output /tmp/status-one.json --validate-only
          if grep -Eqi '([A-Z]:\\|GH_TOKEN|GITHUB_TOKEN|sk-|private inventory)' /tmp/status-one.json; then
            echo 'Generated status contains private control-plane material.' >&2
            exit 1
          fi

      - name: Compile Python
        run: |
          python -m py_compile scripts/validate_project_control.py
          python -m py_compile scripts/audit_project_controls.py
          python -m py_compile scripts/test_audit_project_controls.py
          python -m py_compile scripts/project_status_v2.py
          python -m py_compile scripts/test_project_status_v2.py

  parse-powershell:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Files = @(
            'tools/New-OrderProject.ps1',
            'tools/New-ControlledOrderProject.ps1',
            'tools/Run-ProjectControlAudit.ps1',
            'tools/Prove-Central-Project-Control.ps1',
            'tools/Install-Central-Project-Control.ps1'
          )
          foreach ($File in $Files) {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $File),
              [ref]$Tokens,
              [ref]$Errors
            ) | Out-Null
            if ($Errors.Count -gt 0) {
              $Errors | ForEach-Object { Write-Error "${File}: $_" }
              exit 1
            }
            Write-Host "PASS: $File"
          }

      - name: Test repository probes through GitHub CLI
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          . .\tools\New-OrderProject.ps1 -LibraryOnly

          $Existing = Test-RemoteRepositoryExists -Repository 'armpitpete/project-folder-checker'
          if (-not $Existing) {
            throw 'Existing repository probe incorrectly returned false.'
          }

          $AbsentRepository = 'armpitpete/definitely-absent-project-control-probe-${{ github.run_id }}'
          $Absent = Test-RemoteRepositoryExists -Repository $AbsentRepository
          if ($Absent) {
            throw 'Absent repository probe incorrectly returned true.'
          }

          Write-Host 'PASS: existing and absent repository probes are distinguished'
